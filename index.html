input,select,textarea,button{font:inherit}
@keyframes diaPan{0%,6%{transform:translateX(0)}50%,56%{transform:translateX(calc(-100% + 100vw))}100%{transform:translateX(0)}}

@keyframes diaBob{0%,100%{translate:0 0}50%{translate:0 -10px}}

html[data-a11y-motion] *{animation:none!important;transition:none!important}
html[data-a11y-links] a{text-decoration:underline!important}
html[data-a11y-contrast] body{filter:contrast(1.35) saturate(1.1)}

#carregando{min-height:100vh;display:flex;align-items:center;justify-content:center}
